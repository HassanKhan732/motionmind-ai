<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MotionMind AI - 3D Scene</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      background-color: #0f111a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e0e6ed;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 14px 18px;
      background: rgba(15, 17, 26, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      pointer-events: none;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #00ffcc;
      margin-bottom: 4px;
    }
    p {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    #status-pill {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ffcc;
      margin-right: 6px;
      box-shadow: 0 0 8px #00ffcc;
    }
  </style>
</head>
<body>
  <div id="ui-overlay">
    <h1><span id="status-pill"></span>MotionMind AI - 3D Scene</h1>
    <p>Step 4: Three.js Foundation (Scene, Camera, Lights, Mesh)</p>
  </div>
  <canvas id="canvas-container"></canvas>

  <!-- Load Three.js via ES Module -->
  <script type="module" src="main.js"></script>
</body>
</html>
